<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="sans-serif">
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="410" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a2b40">Neck 구조: FPN(top-down) + PAN(bottom-up)</text>
  <text x="410" y="48" font-size="12" text-anchor="middle" fill="#7a889c">의미 정보는 위→아래로, 위치 정보는 아래→위로 두 번 섞는다</text>

  <!-- column headers -->
  <text x="140" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5a3d">Backbone 특징</text>
  <text x="410" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#5f6a9a">FPN (top-down)</text>
  <text x="680" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#a05070">PAN (bottom-up)</text>

  <!-- rows: P5 top (deep,small), P3 bottom (shallow,large) -->
  <!-- Backbone nodes -->
  <g>
    <rect x="80" y="110" width="120" height="44" rx="6" fill="#8fc2a3" stroke="#5c8a6b"/>
    <text x="140" y="132" font-size="12" text-anchor="middle" fill="#1e3d2a">C5 · 깊음/저해상</text>
    <text x="140" y="147" font-size="10" text-anchor="middle" fill="#2f5a3d">강한 의미, 약한 위치</text>

    <rect x="80" y="210" width="120" height="44" rx="6" fill="#a9d0b7" stroke="#5c8a6b"/>
    <text x="140" y="236" font-size="12" text-anchor="middle" fill="#1e3d2a">C4 · 중간</text>

    <rect x="80" y="310" width="120" height="44" rx="6" fill="#bcdcc7" stroke="#5c8a6b"/>
    <text x="140" y="332" font-size="12" text-anchor="middle" fill="#1e3d2a">C3 · 얕음/고해상</text>
    <text x="140" y="347" font-size="10" text-anchor="middle" fill="#2f5a3d">약한 의미, 강한 위치</text>
  </g>

  <!-- FPN nodes -->
  <g>
    <rect x="350" y="110" width="120" height="44" rx="6" fill="#d6dbee" stroke="#5f6a9a"/>
    <text x="410" y="137" font-size="12" text-anchor="middle" fill="#3a3f66">P5</text>
    <rect x="350" y="210" width="120" height="44" rx="6" fill="#d6dbee" stroke="#5f6a9a"/>
    <text x="410" y="237" font-size="12" text-anchor="middle" fill="#3a3f66">P4</text>
    <rect x="350" y="310" width="120" height="44" rx="6" fill="#d6dbee" stroke="#5f6a9a"/>
    <text x="410" y="337" font-size="12" text-anchor="middle" fill="#3a3f66">P3</text>
  </g>

  <!-- PAN nodes -->
  <g>
    <rect x="620" y="110" width="120" height="44" rx="6" fill="#eed6e0" stroke="#a05070"/>
    <text x="680" y="137" font-size="12" text-anchor="middle" fill="#6e2e48">N5 → Head</text>
    <rect x="620" y="210" width="120" height="44" rx="6" fill="#eed6e0" stroke="#a05070"/>
    <text x="680" y="237" font-size="12" text-anchor="middle" fill="#6e2e48">N4 → Head</text>
    <rect x="620" y="310" width="120" height="44" rx="6" fill="#eed6e0" stroke="#a05070"/>
    <text x="680" y="337" font-size="12" text-anchor="middle" fill="#6e2e48">N3 → Head</text>
  </g>

  <!-- lateral backbone->FPN -->
  <g stroke="#5c8a6b" stroke-width="2" fill="none" marker-end="url(#ag)">
    <path d="M200 132 L348 132"/>
    <path d="M200 232 L348 232"/>
    <path d="M200 332 L348 332"/>
  </g>

  <!-- FPN top-down -->
  <g stroke="#5f6a9a" stroke-width="2.4" fill="none" marker-end="url(#ab)">
    <path d="M410 154 L410 208"/>
    <path d="M410 254 L410 308"/>
  </g>
  <text x="424" y="184" font-size="10" fill="#5f6a9a">upsample+합성</text>
  <text x="424" y="284" font-size="10" fill="#5f6a9a">upsample+합성</text>

  <!-- FPN->PAN lateral -->
  <g stroke="#9a7" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ap)">
    <path d="M470 132 L618 132"/>
    <path d="M470 232 L618 232"/>
    <path d="M470 332 L618 332"/>
  </g>

  <!-- PAN bottom-up -->
  <g stroke="#a05070" stroke-width="2.4" fill="none" marker-end="url(#ap)">
    <path d="M680 308 L680 254"/>
    <path d="M680 208 L680 154"/>
  </g>
  <text x="694" y="284" font-size="10" fill="#a05070">downsample+합성</text>
  <text x="694" y="184" font-size="10" fill="#a05070">downsample+합성</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5c8a6b"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5f6a9a"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a05070"/></marker>
  </defs>
</svg>
