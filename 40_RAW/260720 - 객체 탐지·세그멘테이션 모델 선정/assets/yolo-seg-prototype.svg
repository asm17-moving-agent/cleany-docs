<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a2b40">인스턴스 세그멘테이션: 프로토타입 마스크 × 계수 (YOLACT 방식)</text>

  <!-- Proto branch -->
  <text x="150" y="70" font-size="13" font-weight="bold" text-anchor="middle" fill="#2f5a3d">① 프로토타입 마스크 32장</text>
  <text x="150" y="88" font-size="10.5" text-anchor="middle" fill="#7a889c">이미지 전체 공통 패턴 (물체와 무관)</text>
  <g>
    <rect x="70" y="100" width="120" height="90" rx="4" fill="#eaf3ee" stroke="#5c8a6b"/>
    <rect x="82" y="112" width="120" height="90" rx="4" fill="#dcebe2" stroke="#5c8a6b"/>
    <rect x="94" y="124" width="120" height="90" rx="4" fill="#c9e0d2" stroke="#5c8a6b"/>
    <circle cx="150" cy="168" r="24" fill="#9cc4ab"/>
    <path d="M110 200 Q154 150 214 190" stroke="#6b9a7d" stroke-width="3" fill="none"/>
    <text x="154" y="232" font-size="10.5" text-anchor="middle" fill="#2f5a3d">proto₁ … proto₃₂</text>
  </g>

  <!-- Coefficient branch -->
  <text x="150" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a5e1f">② 마스크 계수 벡터 (물체별)</text>
  <text x="150" y="308" font-size="10.5" text-anchor="middle" fill="#7a889c">탐지 헤드가 박스마다 길이 32 출력</text>
  <g font-size="10" fill="#8a5e1f">
    <rect x="60" y="320" width="34" height="26" fill="#f2d9b8" stroke="#b3823c"/><text x="77" y="337" text-anchor="middle">0.8</text>
    <rect x="96" y="320" width="34" height="26" fill="#f7e7cf" stroke="#b3823c"/><text x="113" y="337" text-anchor="middle">-0.2</text>
    <rect x="132" y="320" width="34" height="26" fill="#f2d9b8" stroke="#b3823c"/><text x="149" y="337" text-anchor="middle">0.5</text>
    <rect x="168" y="320" width="34" height="26" fill="#f7e7cf" stroke="#b3823c"/><text x="185" y="337" text-anchor="middle">…</text>
    <rect x="204" y="320" width="34" height="26" fill="#f2d9b8" stroke="#b3823c"/><text x="221" y="337" text-anchor="middle">0.1</text>
  </g>

  <!-- combine -->
  <circle cx="430" cy="215" r="34" fill="#eef0f7" stroke="#5f6a9a"/>
  <text x="430" y="210" font-size="22" text-anchor="middle" fill="#3a3f66">Σ</text>
  <text x="430" y="230" font-size="10" text-anchor="middle" fill="#3a3f66">선형결합</text>
  <text x="430" y="272" font-size="10.5" text-anchor="middle" fill="#7a889c">계수 × 프로토타입</text>

  <!-- arrows into combine -->
  <path d="M216 168 Q330 168 400 205" stroke="#5c8a6b" stroke-width="2.2" fill="none" marker-end="url(#a1)"/>
  <path d="M240 333 Q340 333 405 240" stroke="#b3823c" stroke-width="2.2" fill="none" marker-end="url(#a2)"/>

  <!-- raw mask -->
  <rect x="510" y="165" width="100" height="100" rx="4" fill="#e7ecf6" stroke="#5f6a9a"/>
  <ellipse cx="560" cy="215" rx="30" ry="22" fill="#aeb9dc"/>
  <text x="560" y="285" font-size="10.5" text-anchor="middle" fill="#3a3f66">③ 물체 마스크(원시)</text>
  <path d="M464 215 L508 215" stroke="#4a5a72" stroke-width="2.4" fill="none" marker-end="url(#a0)"/>

  <!-- crop -->
  <rect x="670" y="165" width="100" height="100" rx="4" fill="#f7fbf8" stroke="#3d8a5c"/>
  <rect x="700" y="188" width="55" height="54" fill="none" stroke="#b35c5c" stroke-width="2" stroke-dasharray="4 2"/>
  <ellipse cx="722" cy="215" rx="22" ry="20" fill="#9cc4ab"/>
  <text x="720" y="285" font-size="10.5" text-anchor="middle" fill="#256b40">④ 업샘플 + 박스로 crop</text>
  <path d="M612 215 L668 215" stroke="#4a5a72" stroke-width="2.4" fill="none" marker-end="url(#a0)"/>

  <!-- final -->
  <path d="M772 215 L812 215" stroke="#4a5a72" stroke-width="2.4" fill="none" marker-end="url(#a0)"/>
  <rect x="814" y="180" width="72" height="70" rx="6" fill="#e9f7ee" stroke="#3d8a5c"/>
  <text x="850" y="210" font-size="11" text-anchor="middle" fill="#256b40">최종</text>
  <text x="850" y="226" font-size="11" text-anchor="middle" fill="#256b40">마스크</text>

  <text x="450" y="380" font-size="10.5" text-anchor="middle" fill="#7a889c">프로토타입은 한 번만 만들고 물체마다 계수만 바꿔 조합 → 연산량이 작아 실시간에 유리</text>

  <defs>
    <marker id="a0" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#4a5a72"/></marker>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#5c8a6b"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#b3823c"/></marker>
  </defs>
</svg>
